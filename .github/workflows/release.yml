name: Build and Release TDM

on:
  push:
    tags:
      - 'v*'
      
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:

  # ======================================
  # LINUX
  # ======================================

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../tdm.pro CONFIG+=release
          make -j2

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp build/tdm AppDir/usr/bin/

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          QMAKE="$(command -v qmake)" \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/tdm \
            --desktop-file resources/tdm.desktop \
            --icon-file resources/tdm.png \
            --plugin qt \
            --output appimage

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy-x86_64.AppImage' \
            ! -name 'linuxdeploy-plugin-qt-x86_64.AppImage' \
            -print -quit)

          if [[ -z "$APPIMAGE" ]]; then
            echo "AppImage not found. Current directory contents:"
            ls -lah
            exit 1
          fi

          mv "$APPIMAGE" "tdm-${VERSION}-x86_64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: tdm-*-x86_64.AppImage
          if-no-files-found: error

  # ======================================
  # WINDOWS
  # ======================================

  build-windows:
    name: Windows ZIP (MinGW)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          
      - name: Configure MinGW
        shell: pwsh
        run: |
          Write-Host "Qt tools directory: $env:IQTA_TOOLS"

          # Find the MinGW 13.1 compiler installed by install-qt-action
          $compiler = Get-ChildItem -Path $env:IQTA_TOOLS -Filter g++.exe -Recurse |
            Where-Object { $_.FullName -match 'mingw1310' } |
            Select-Object -First 1

          if (-not $compiler) {
            Write-Host "Available g++ compilers:"
            Get-ChildItem -Path $env:IQTA_TOOLS -Filter g++.exe -Recurse |
              Select-Object -ExpandProperty FullName

            throw "MinGW 13.1 compiler was not found. Check the Qt tools installation."
          }
          
          $mingwBin = $compiler.Directory.FullName
          
          # Put the matching compiler first in PATH for this and later steps
          $env:PATH = "$mingwBin;$env:PATH"
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Using compiler: $($compiler.FullName)"
          & $compiler.FullName --version
          
          Write-Host "Using make:"
          Get-Command mingw32-make

      - name: Clean build directory
        shell: pwsh
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build
          cd build

          qmake ../tdm.pro "CONFIG+=release"
          mingw32-make -j2

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy

          $exe = Get-ChildItem -Path build -Filter tdm.exe -Recurse |
                 Select-Object -First 1

          if (-not $exe) {
              Get-ChildItem -Path build -Recurse
              throw "tdm.exe was not generated."
          }

          Copy-Item $exe.FullName deploy/tdm.exe

          windeployqt `
            --release `
            --dir deploy `
            deploy/tdm.exe

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $version = "${{ inputs.version }}"
          }

          Compress-Archive `
            -Path deploy/* `
            -DestinationPath "tdm-$version-Windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: tdm-*-Windows-x64.zip
          if-no-files-found: error

  # ======================================
  # MACOS INTEL
  # ======================================

  build-macos:
    name: macOS DMG
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64

      - name: Build
        run: |
          mkdir build
          cd build

          qmake ../tdm.pro CONFIG+=release
          make -j2

      - name: Deploy and create DMG
        run: |
          macdeployqt build/tdm.app -dmg

          VERSION="${GITHUB_REF_NAME#v}"

          mv build/tdm.dmg \
             "tdm-${VERSION}-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: tdm-*-macos.dmg
          if-no-files-found: error

  # ======================================
  # GITHUB RELEASE
  # ======================================

  publish-release:
    if: false
    name: Publish Release

    runs-on: ubuntu-22.04

    needs:
      - build-linux
      - build-windows
      - build-macos

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify assets
        run: |
          ls -lh release-assets/
          test "$(find release-assets -type f | wc -l)" -eq 3

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TDM ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

